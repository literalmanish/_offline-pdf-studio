name: Pull Request CI

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-validation:
    name: PR Validation & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper Binary
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Check Git Diff Cleanliness
        run: |
          git diff --check origin/main..HEAD

      - name: Run Host Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --stacktrace

      - name: Compile Android Test Sources
        run: |
          ./gradlew compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Host Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-unit-test-reports-pr-${{ github.event.pull_request.number }}
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-pdf-studio-debug-apk-pr-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
