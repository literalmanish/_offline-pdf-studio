name: Main Branch CI

on:
  push:
    branches: [ "main" ]

concurrency:
  group: main-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-unit-test:
    name: Build & Host Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Host Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --stacktrace

      - name: Build Debug & Release Artifacts
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Validate Release Artifact Integrity & Permissions
        run: |
          ./gradlew validateReleaseArtifacts --no-daemon --stacktrace

      - name: Upload Host Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-reports-main-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release Artifacts & SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.sha256
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

  android-instrumentation-test:
    name: Android 14 Instrumentation Tests
    needs: build-and-unit-test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Connected Instrumentation Tests (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Connected Test Results & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-test-results-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14
